[project]
name = "repomind"
version = "0.1.0"
description = "Chat with GitHub repositories using local LLMs."
requires-python = ">=3.9"

dependencies = [
    "typer",
    "rich",
    "gitpython",
    "chromadb",
    "ollama",
    "pydantic",
    "arize-phoenix"
]

[project.scripts]
repomind = "repomind.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]